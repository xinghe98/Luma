name: luma
description: "轻影 Luma 私有媒体管理播放器交互原型。"
publish_to: 'none'

# 此文件由 tool/sync_app_metadata.dart 从 app_metadata.json 生成，请勿手工修改。 元数据指纹：
version: 1.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.9.0
  ffi: ^2.2.0
  flutter_secure_storage: ^9.2.4
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^14.8.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
