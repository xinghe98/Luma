# Flutter 持续集成覆盖检查、Android 调试包与 Windows x64 便携包。
name: Mobile

on:
  push:
    paths:
      - "mobile/**"
      - "backend/scripts/windows-deploy.ps1"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/scripts/windows-deploy.ps1"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - shell: pwsh
        run: ..\backend\scripts\windows-deploy.ps1 -Action PackageClient
      - uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x64
          path: mobile/build/dist/luma-windows-x64-*.zip
          if-no-files-found: error
