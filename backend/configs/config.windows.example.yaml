# 本配置展示 Windows 本地盘符、UNC 路径和显式工具路径写法。
server:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 30s

# Windows 路径使用 YAML 单引号，避免反斜杠转义。
security:
  admin_username: admin
  admin_password_file: 'C:\ProgramData\Luma\secrets\admin_password'
  allowed_origins: []
  allowed_roots:
    - 'D:\Media'
    - '\\NAS\Videos'

# 数据库、管理员密码文件和衍生数据建议放在服务账户可写的 ProgramData 目录。
database:
  path: 'C:\ProgramData\Luma\media.db'
  busy_timeout_ms: 5000
  wal: true

# 衍生数据不得写入只读媒体源或网络共享。
storage:
  thumbnail_dir: 'C:\ProgramData\Luma\thumbnails'
  cache_dir: 'C:\ProgramData\Luma\cache'

# 后台服务不依赖用户 PATH，因此显式指定媒体工具路径。
media:
  ffmpeg_path: 'C:\Tools\ffmpeg\bin\ffmpeg.exe'
  ffprobe_path: 'C:\Tools\ffmpeg\bin\ffprobe.exe'
  thumbnail_width: 640
  scan_extensions: [mp4, mkv, mov, avi, webm, m4v, ts, jpg, jpeg, png, webp, gif, bmp, nfo]

# Worker 数量控制后台媒体处理的资源占用。
workers:
  scan: 1
  probe: 2
  thumbnail: 1
  lock_timeout: 10m

# TMDb 在部分网络环境不可直连；必要时填写本机 HTTP 代理。
metadata:
  language: zh-CN
  region: CN
  fallback_languages: [en-US]
  refresh_interval: 720h
  request_timeout: 15s
  workers: 1
  requests_per_second: 4
  auto_match_threshold: 0
  auto_match_margin: 0
  proxy_url: 'http://127.0.0.1:7890'
  providers:
    nfo:
      enabled: true
    tmdb:
      enabled: false
      options:
        access_token: ''
        api_base_url: https://api.themoviedb.org/3
        image_base_url: https://image.tmdb.org/t/p/original
