# 本配置用于容器部署：部署脚本会按 .env 重写 allowed_roots，其余字段保持不变。
server:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 30s
security:
  api_token_file: /data/secrets/api_token
  allowed_origins: []
  allowed_roots: [/media]
database:
  path: /data/media.db
  busy_timeout_ms: 5000
  wal: true
storage:
  thumbnail_dir: /data/thumbnails
  cache_dir: /data/cache
media:
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  thumbnail_width: 640
  scan_extensions: [mp4, mkv, mov, avi, webm, m4v, ts, jpg, jpeg, png, webp, gif, bmp, nfo]
workers:
  scan: 1
  probe: 2
  thumbnail: 1
  lock_timeout: 10m
metadata:
  language: zh-CN
  region: CN
  fallback_languages: [en-US]
  refresh_interval: 720h
  request_timeout: 15s
  workers: 1
  requests_per_second: 4
  auto_match_threshold: 90
  auto_match_margin: 8
  proxy_url: ""
  providers:
    nfo:
      enabled: true
    tmdb:
      enabled: __LUMA_TMDB_ENABLED__
      options:
        access_token: __LUMA_TMDB_ACCESS_TOKEN__
        api_base_url: https://api.themoviedb.org/3
        image_base_url: https://image.tmdb.org/t/p/original
