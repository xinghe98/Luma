# 本配置用于仓库内本地开发，所有相对路径均相对于本文件解析。
server:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 30s

# 管理员初始密码不写入 YAML，而是存放在独立安全文件中。
security:
  admin_username: admin
  admin_password_file: ../data/secrets/admin_password
  allowed_origins: []
  allowed_roots:
    - ../data/media

# SQLite 数据必须位于只读媒体目录之外。
database:
  path: ../data/media.db
  busy_timeout_ms: 5000
  wal: true

# 缩略图和缓存属于可再生成的衍生数据。
storage:
  thumbnail_dir: ../data/thumbnails
  cache_dir: ../data/cache

# 外部媒体工具按参数数组调用，不经过 Shell 拼接。
media:
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  thumbnail_width: 640
  scan_extensions: [mp4, mkv, mov, avi, webm, m4v, ts, jpg, jpeg, png, webp, gif, bmp, nfo]
  # 自动扫描默认开启：服务端在文件变更（debounce）与定时周期触发全量扫描；
  # 仍走既有 ScanService/ScanWorker，每源同一时间最多一条 active 任务。
  # mode: hybrid=目录监听+定时兜底；poll=仅定时；watch=仅监听（Docker/NAS 可能漏事件）。
  auto_scan:
    enabled: true
    mode: hybrid
    interval: 30m
    debounce: 30s

# Worker 数量限制并发媒体处理对主机资源的占用。
workers:
  scan: 1
  probe: 2
  thumbnail: 1
  lock_timeout: 10m

# 影视刮削默认只读取本地 NFO。启用 TMDb 时必须填写 Read Access Token。
metadata:
  language: zh-CN
  region: CN
  fallback_languages: [en-US]
  refresh_interval: 720h
  request_timeout: 15s
  workers: 1
  requests_per_second: 4
  auto_match_threshold: 0
  auto_match_margin: 0
  proxy_url: ""
  providers:
    nfo:
      enabled: true
    tmdb:
      enabled: false
      options:
        access_token: ""
        api_base_url: https://api.themoviedb.org/3
        image_base_url: https://image.tmdb.org/t/p/original
