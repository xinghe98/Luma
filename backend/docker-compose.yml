# Docker 服务定义。媒体目录和运行时配置由 scripts/docker-compose.sh 根据 .env 生成。
services:
  luma-server:
    build:
      context: .
      args:
        VERSION: ${LUMA_VERSION:-dev}
    ports:
      - "127.0.0.1:${LUMA_PORT:-8080}:8080"
    volumes:
      - luma-data:/data
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    # 健康检查只访问不需要 Token 的存活端点。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  luma-data:
