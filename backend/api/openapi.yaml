# Luma V0.1 系统接口契约；后续业务端点继续在同一文件扩展。
openapi: 3.1.0
info:
  title: Luma Local Media API
  version: 0.1.0
servers:
  - url: /
paths:
  /health:
    get:
      summary: 查询服务进程存活状态
      responses:
        "200":
          description: 服务进程正常运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/system/info:
    get:
      summary: 查询服务端运行信息
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 服务端运行信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sources:
    get:
      summary: 查询媒体源列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 不包含真实根路径的媒体源列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: 创建本地媒体源
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSource" }
      responses:
        "201":
          description: 媒体源已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/ForbiddenPath" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/media-roots:
    get:
      summary: 查询可用于新增媒体源的服务端目录
      description: 仅管理员可调用。返回 security.allowed_roots 中已配置的目录，供客户端选择，普通媒体源接口不会返回真实路径。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 已配置的媒体根目录
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    patch:
      summary: 更新或重新启用媒体源
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSource" }
      responses:
        "200":
          description: 更新后的媒体源
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 软禁用媒体源并保留全部索引
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 媒体源已禁用 }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sources/{id}/scan:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    post:
      summary: 创建异步媒体源扫描任务
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: 扫描任务已持久化并等待执行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/scan-jobs/latest:
    get:
      summary: 查询最近扫描任务
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: source_id
          schema: { type: string }
      responses:
        "200":
          description: 最近扫描任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scan-jobs/{id}:
    get:
      summary: 查询扫描任务状态和进度
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 扫描任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/media:
    get:
      summary: 查询媒体列表
      description: |
        默认排除状态为 missing 的媒体，以及已禁用或软删除来源下的媒体。
        sort=duration 时仅包含 duration 已稳定的行（duration_ms 非空，或 status 为 ready/failed）。
        sort=file_size 时仅包含 status 为 ready/failed 的行。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          description: 按文件名搜索，最多 200 个字符。
          schema: { type: string, maxLength: 200 }
        - in: query
          name: type
          schema: { type: string, enum: [video, image] }
        - in: query
          name: library_kind
          description: 严格限制视频来源用途；个人视频页使用 personal，避免混入电影和电视剧源。图片库仅按 type=image 查询。
          schema: { type: string, enum: [personal, movies, tv] }
        - in: query
          name: favorite
          description: true 仅返回收藏媒体；false 包含未创建用户数据的媒体。
          schema: { type: boolean }
        - in: query
          name: tag_id
          description: 仅返回关联当前用户指定标签的媒体。
          schema: { type: string, maxLength: 200 }
        - in: query
          name: watch_status
          description: 按当前用户观看状态筛选；无用户数据的媒体归入 unwatched。
          schema: { type: string, enum: [unwatched, watching, completed] }
        - in: query
          name: sort
          description: created_at/filename 含处理中媒体；duration/file_size 仅含排序键已稳定的行。
          schema:
            type: string
            enum: [created_at, filename, duration, file_size]
            default: created_at
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: cursor
          description: 上一页返回的不透明游标；筛选或排序条件改变后不可复用。
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 媒体列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/media/count:
    get:
      summary: 统计当前可见媒体数量
      description: 使用与媒体列表相同的来源授权和筛选规则，仅返回聚合数量，不分页也不返回媒体条目。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: type
          schema: { type: string, enum: [video, image] }
        - in: query
          name: library_kind
          schema: { type: string, enum: [personal, movies, tv] }
        - in: query
          name: favorite
          schema: { type: boolean }
        - in: query
          name: tag_id
          schema: { type: string, maxLength: 200 }
        - in: query
          name: watch_status
          schema: { type: string, enum: [unwatched, watching, completed] }
      responses:
        "200":
          description: 当前用户可见媒体总数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaCount" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/media/continue-watching:
    get:
      summary: 查询继续观看列表
      description: 返回有进度、未完成且当前可见的视频，按最近播放时间和媒体 ID 降序稳定分页。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          description: 与当前用户和继续观看集合绑定的不透明游标。
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 继续观看媒体列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/media/{id}:
    parameters:
      - $ref: "#/components/parameters/MediaID"
    get:
      summary: 查询媒体详情
      description: missing 媒体及已禁用或软删除来源下的媒体视为不存在。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 媒体详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
  /api/v1/media/{id}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/MediaID"
    get:
      summary: 获取媒体缩略图
      description: |
        返回当前可用的默认或卡片图片资产；支持使用 If-None-Match 进行 ETag 条件请求。
        若资产已记录内容哈希且 If-None-Match 命中，服务端可直接返回 304 而不读取文件体。
        内容变更重新生成完成前，仍可能提供上一份 ready 缩略图。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: variant
          description: 省略时保持原有默认缩略图行为；card 为 640×400 居中裁剪卡片图。
          schema: { type: string, enum: [default, card], default: default }
        - in: header
          name: If-None-Match
          description: 客户端缓存的缩略图 ETag。
          schema: { type: string }
      responses:
        "200":
          description: 缩略图二进制内容
          headers:
            ETag:
              description: 当前缩略图资产的强 ETag。
              schema: { type: string }
            Cache-Control:
              description: 固定为 private, max-age=604800, must-revalidate。
              schema: { type: string, const: "private, max-age=604800, must-revalidate" }
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: If-None-Match 与当前 ETag 匹配，无响应体。
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: "private, max-age=604800, must-revalidate" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaOrThumbnailNotFound" }
  /api/v1/media/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/MediaID"
    get:
      summary: 播放原始视频
      description: |
        仅服务可见的视频原文件，支持标准单段 HTTP Range、条件请求和进度跳转。
        discovered、probing、thumbnailing、ready、failed 状态均可 Direct Play；图片和不可见媒体返回 404。
        弱 ETag 与 Content-Length 均基于打开瞬间的 size/mtime 快照；媒体源根目录不可访问时返回 503 SOURCE_OFFLINE。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Range
          schema: { type: string, examples: ["bytes=0-1048575"] }
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: header
          name: If-Modified-Since
          schema: { type: string }
        - in: header
          name: If-Range
          description: 弱 ETag 不能用于 If-Range 强比较；客户端可使用 Last-Modified 日期。
          schema: { type: string }
      responses:
        "200":
          description: 完整视频内容
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64 } }
            ETag: { schema: { type: string }, description: 由打开瞬间文件大小和秒级修改时间生成的弱 ETag。 }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
          content:
            video/*:
              schema: { type: string, format: binary }
        "206":
          description: Range 指定的部分视频内容
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64 } }
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
          content:
            video/*:
              schema: { type: string, format: binary }
        "304":
          description: 条件请求命中，无响应体
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "416":
          description: Range 不可满足；Content-Range 为 bytes */快照文件大小，响应体由 Go 标准库生成。
          headers:
            Content-Range: { schema: { type: string } }
        "503":
          description: 媒体源根目录当前不可访问，error.code 为 SOURCE_OFFLINE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    head:
      summary: 查询原始视频响应元数据
      description: 与 GET 使用相同的认证、可见性和条件请求语义，但不返回响应体。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: header
          name: If-Modified-Since
          schema: { type: string }
      responses:
        "200":
          description: 视频响应元数据
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64 } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
        "304": { description: 条件请求命中，无响应体 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "503":
          description: 媒体源根目录当前不可访问，error.code 为 SOURCE_OFFLINE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/media/{id}/original:
    parameters:
      - $ref: "#/components/parameters/MediaID"
    get:
      summary: 浏览原始图片
      description: |
        仅服务可见的图片原文件，支持 HTTP Range 和条件请求；视频和不可见媒体返回 404。
        discovered、probing、thumbnailing、ready、failed 状态均可读取原图，不依赖缩略图处理结果。
        弱 ETag 与 Content-Length 均基于打开瞬间的 size/mtime 快照；媒体源根目录不可访问时返回 503 SOURCE_OFFLINE。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Range
          schema: { type: string, examples: ["bytes=0-1048575"] }
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: header
          name: If-Modified-Since
          schema: { type: string }
        - in: header
          name: If-Range
          description: 弱 ETag 不能用于 If-Range 强比较；客户端可使用 Last-Modified 日期。
          schema: { type: string }
      responses:
        "200":
          description: 完整原始图片
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64 } }
            ETag: { schema: { type: string }, description: 由打开瞬间文件大小和秒级修改时间生成的弱 ETag。 }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "206":
          description: Range 指定的部分图片内容
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64 } }
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: 条件请求命中，无响应体
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "416":
          description: Range 不可满足；Content-Range 为 bytes */快照文件大小，响应体由 Go 标准库生成。
          headers:
            Content-Range: { schema: { type: string } }
        "503":
          description: 媒体源根目录当前不可访问，error.code 为 SOURCE_OFFLINE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    head:
      summary: 查询原始图片响应元数据
      description: 与 GET 使用相同的认证、可见性和条件请求语义，但不返回响应体。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: header
          name: If-Modified-Since
          schema: { type: string }
      responses:
        "200":
          description: 原始图片响应元数据
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64 } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: "private, max-age=0, must-revalidate" } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
        "304": { description: 条件请求命中，无响应体 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "503":
          description: 媒体源根目录当前不可访问，error.code 为 SOURCE_OFFLINE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/media/{id}/user-data:
    parameters:
      - $ref: "#/components/parameters/MediaID"
    get:
      summary: 查询媒体用户数据
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 当前用户的完整媒体数据；无记录时 revision 为 0。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUserData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
    patch:
      summary: 原子修改用户数据和媒体标签
      description: 字段缺失表示保持不变；custom_title/notes 为 null 表示清除；tag_ids 表示完整替换。base_revision 不匹配返回 409。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMediaUserData" }
      responses:
        "200":
          description: 更新后的完整用户数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUserData" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 媒体不存在时 error.code 为 MEDIA_NOT_FOUND；tag_ids 含不存在或不属于当前用户的标签时为 TAG_NOT_FOUND。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/media/{id}/progress:
    parameters:
      - $ref: "#/components/parameters/MediaID"
    put:
      summary: 保存视频播放进度
      description: |
        在同一事务内读取服务端媒体时长后截断 position_ms；达到时长 90% 自动完成。
        与 PATCH /user-data 共用 media_user_data.revision；旧 base_revision 返回 409 REVISION_CONFLICT。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProgress" }
      responses:
        "200":
          description: 更新后的完整用户数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUserData" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: 目标媒体不是可播放视频，error.code 为 MEDIA_NOT_PLAYABLE。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/tags:
    get:
      summary: 查询当前用户标签
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: 创建标签
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTag" }
      responses:
        "201":
          description: 已创建标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tags/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      summary: 重命名标签
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTag" }
      responses:
        "200":
          description: 更新后的标签
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: 删除标签和关联关系
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 标签已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/catalog:
    get:
      summary: 查询电影和电视剧作品库
      description: 查询前幂等整理新增或发生变化的影视文件；个人媒体不进入作品库。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [movie, series] }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 作品级媒体列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/catalog/artwork/{id}:
    get:
      summary: 读取作品海报或背景图
      description: 首次读取时由服务端向所属 Provider 获取并缓存；不会向客户端暴露 Provider 凭据或原始图片 URL。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        "200":
          description: 图片内容
          headers:
            ETag: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: 客户端缓存仍有效 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/catalog/{id}/candidates:
    get:
      summary: 查询待人工确认的统一刮削候选（仅管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已持久化的低置信候选
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MetadataCandidate" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/catalog/{id}/refresh:
    post:
      summary: 重新排队刮削一个作品（仅管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "202":
          description: 已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataQueueResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/catalog/refresh:
    post:
      summary: 重新排队刮削全部作品或一个来源（仅管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source_id: { type: string }
      responses:
        "202":
          description: 已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataQueueResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/catalog/{id}/identity:
    put:
      summary: 选择并锁定作品的 Provider 身份（仅管理员）
      description: 人工锁定不是自动刮削前置条件；只有低置信或错误匹配时才调用。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectMetadataIdentity" }
      responses:
        "204": { description: 身份已锁定并排队刷新 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/metadata/status:
    get:
      summary: 查询已注册刮削器能力和健康状态（仅管理员）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 不包含 Token、代理凭据或原始 Provider URL
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MetadataProviderStatus" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users:
    get:
      summary: 查询用户（仅管理员）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AccessUser" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 创建成员（仅管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                request_id:
                  type: string
                  maxLength: 128
                  description: 客户端为一次创建操作生成并在网络重试时复用的不透明幂等键。
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{id}:
    patch:
      summary: 修改成员名称或启用状态（仅管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                enabled: { type: boolean }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{id}/tokens:
    get:
      summary: 查询成员令牌元数据（仅管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: 不包含令牌明文
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AccessToken" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 签发成员令牌（仅管理员，明文只返回一次）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                expires_at: { type: [string, "null"], format: date-time }
                request_id:
                  type: string
                  maxLength: 128
                  description: 客户端为一次签发操作生成并在网络重试时复用的不透明幂等键。
      responses:
        "201":
          description: 已签发；token 字段不会再次返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedAccessToken" }
        "409":
          description: 令牌已创建但服务重启后无法安全重放一次性明文；不得以新 request_id 自动重试。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/tokens/{id}:
    delete:
      summary: 吊销成员令牌（仅管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: 已吊销 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{id}/sources:
    get:
      summary: 查询成员可访问的媒体源（仅管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: 来源 ID 列表
          content:
            application/json:
              schema:
                type: object
                required: [source_ids]
                properties:
                  source_ids: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{id}/sources/{sourceId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: sourceId, required: true, schema: { type: string } }
    put:
      summary: 授予媒体源访问权（仅管理员）
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 已授权 }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: 移除媒体源访问权（仅管理员）
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 已移除 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/catalog/issues:
    get:
      summary: 查询待人工整理的影视文件
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 未能可靠识别的文件
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CatalogIssue" } }
  /api/v1/catalog/media/{id}:
    patch:
      summary: 人工修正或忽略文件的作品归属
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MediaID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCatalogMatch" }
      responses:
        "204": { description: 整理结果已锁定保存 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/MediaNotFound" }
  /api/v1/catalog/{id}:
    get:
      summary: 查询作品详情及剧集选集列表
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 作品详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: 更新当前用户的作品级收藏
      description: 收藏绑定作品，不随 4K、1080p 等本地媒体版本切换而丢失。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCatalogUserData" }
      responses:
        "200":
          description: 已更新作品用户数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogUserData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    SystemInfo:
      type: object
      required: [version, platform, architecture, database, user, capabilities]
      properties:
        version: { type: string }
        platform: { type: string }
        architecture: { type: string }
        database: { type: string }
        user:
          type: object
          required: [id, name, role]
          properties:
            id: { type: string }
            name: { type: string }
            role: { type: string, enum: [admin, member] }
        capabilities:
          type: array
          items: { type: string }
    AccessUser:
      type: object
      required: [id, name, role, enabled, online, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        enabled: { type: boolean }
        online: { type: boolean, description: 最近 2 分钟内有已认证服务端访问。 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccessToken:
      type: object
      required: [id, user_id, name, token_prefix, expires_at, revoked_at, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        token_prefix: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    IssuedAccessToken:
      allOf:
        - $ref: "#/components/schemas/AccessToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 仅在签发响应中出现一次的明文令牌。
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    CreateSource:
      type: object
      additionalProperties: false
      required: [name, root_path]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        root_path: { type: string, minLength: 1 }
        library_kind: { type: string, enum: [personal, movies, tv], default: personal }
    UpdateSource:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        root_path: { type: string, minLength: 1 }
        enabled: { type: boolean }
        library_kind: { type: string, enum: [personal, movies, tv] }
    Source:
      type: object
      required: [id, name, type, library_kind, enabled, status, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, const: local }
        library_kind: { type: string, enum: [personal, movies, tv] }
        enabled: { type: boolean }
        status: { type: string, enum: [online, offline, degraded, disabled] }
        last_scan_id: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScanJob:
      type: object
      required: [id, source_id, status, phase, discovered_count, processed_count, failed_count, created_at, updated_at, processing, metadata]
      properties:
        id: { type: string }
        source_id: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, cancelled, interrupted] }
        phase: { type: string }
        discovered_count: { type: integer, format: int64, minimum: 0 }
        processed_count: { type: integer, format: int64, minimum: 0 }
        failed_count: { type: integer, format: int64, minimum: 0 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error_code: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        processing: { $ref: "#/components/schemas/ProcessingSummary" }
        metadata: { $ref: "#/components/schemas/MetadataSummary" }
    ProcessingSummary:
      type: object
      required: [status, total, discovered, probing, thumbnailing, ready, failed]
      properties:
        status: { type: string, enum: [pending, running, completed, completed_with_errors] }
        total: { type: integer, format: int64, minimum: 0 }
        discovered: { type: integer, format: int64, minimum: 0 }
        probing: { type: integer, format: int64, minimum: 0 }
        thumbnailing: { type: integer, format: int64, minimum: 0 }
        ready: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
    MetadataSummary:
      type: object
      required: [status, total, pending, refreshing, ready, unmatched, failed]
      properties:
        status: { type: string, enum: [waiting, running, completed, completed_with_errors] }
        total: { type: integer, format: int64, minimum: 0 }
        pending: { type: integer, format: int64, minimum: 0 }
        refreshing: { type: integer, format: int64, minimum: 0 }
        ready: { type: integer, format: int64, minimum: 0 }
        unmatched: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
    MediaPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaSummary" }
        next_cursor:
          type: [string, "null"]
          description: 下一页的不透明游标；没有下一页时为 null。
    MediaCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    MediaSummary:
      type: object
      required: [id, title, filename, media_type, library_kind, duration_ms, width, height, thumbnail_url, card_thumbnail_url, stream_url, original_url, favorite, progress_ms, completed, last_played_at, user_data_revision, status, created_at]
      properties:
        id: { type: string }
        title: { type: string, description: 按 custom_title、detected_title、filename 顺序计算的展示标题。 }
        filename: { type: string }
        media_type: { type: string, enum: [video, image] }
        library_kind: { type: string, enum: [personal, movies, tv] }
        catalog_item_id:
          type: [string, "null"]
          description: 已匹配电影或剧集的作品 ID；个人媒体和未识别文件为 null。
        duration_ms: { type: [integer, "null"], format: int64, minimum: 0 }
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        thumbnail_url:
          type: string
          description: 当前媒体的缩略图端点；不存在 ready 默认缩略图资产时为空字符串。
        card_thumbnail_url:
          type: string
          description: 16:10 居中裁剪的卡片缩略图端点；尚未补齐时为空字符串。
        stream_url:
          type: [string, "null"]
          description: 视频的 Direct Play 地址；图片固定为 null。
        original_url:
          type: [string, "null"]
          description: 图片原文件地址；视频固定为 null。
        favorite: { type: boolean, description: 读取现有用户数据；无记录时为 false。 }
        progress_ms: { type: integer, format: int64, minimum: 0, description: 读取现有用户数据；无记录时为 0。 }
        completed: { type: boolean, description: 是否已达到服务端完成阈值。 }
        last_played_at: { type: [string, "null"], format: date-time }
        user_data_revision: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [discovered, probing, thumbnailing, ready, failed] }
        created_at: { type: string, format: date-time, description: 媒体首次进入媒体库的时间。 }
    MediaDetail:
      allOf:
        - $ref: "#/components/schemas/MediaSummary"
        - type: object
          required: [source_id, mime_type, file_size, video_codec, audio_codec, container, bitrate, frame_rate_num, frame_rate_den, audio_track_count, orientation, captured_at, indexed_at]
          properties:
            source_id: { type: string }
            mime_type: { type: string }
            file_size: { type: integer, format: int64, minimum: 0 }
            video_codec: { type: string }
            audio_codec: { type: string }
            container: { type: string }
            bitrate: { type: integer, format: int64, minimum: 0 }
            frame_rate_num: { type: [integer, "null"] }
            frame_rate_den: { type: [integer, "null"], minimum: 1 }
            audio_track_count: { type: [integer, "null"], minimum: 0 }
            orientation: { type: [integer, "null"] }
            captured_at: { type: [string, "null"], format: date-time }
            indexed_at: { type: [string, "null"], format: date-time }
    CatalogEpisode:
      type: object
      required: [id, season_number, episode_number, title, media_id, duration_ms, resolution, progress_ms, completed, thumbnail_url]
      properties:
        id: { type: string }
        season_number: { type: integer, minimum: 0 }
        episode_number: { type: integer, minimum: 1 }
        title: { type: string }
        media_id: { type: string }
        duration_ms: { type: [integer, "null"], format: int64, minimum: 0 }
        resolution: { type: string, description: 视频宽高，尚未探测时为空字符串。 }
        progress_ms: { type: integer, format: int64, minimum: 0 }
        completed: { type: boolean }
        thumbnail_url: { type: string }
    CatalogItem:
      type: object
      required: [id, source_id, kind, title, original_title, year, release_date, end_date, certification, community_rating, vote_count, genres, match_status, metadata_status, metadata_revision, metadata_error_code, provider, provider_item_id, identity_locked, media_count, episode_count, completed_count, playable_media_id, thumbnail_url, poster_url, backdrop_url, duration_ms, resolution, progress_ms, completed, favorite, favorite_revision, updated_at]
      properties:
        id: { type: string }
        source_id: { type: string }
        kind: { type: string, enum: [movie, series] }
        title: { type: string }
        original_title: { type: string }
        year: { type: [integer, "null"] }
        overview: { type: string }
        tagline: { type: string }
        release_date: { type: string, description: Provider 返回的 ISO 日期；缺失时为空字符串。 }
        end_date: { type: string }
        certification: { type: string }
        community_rating: { type: [number, "null"], minimum: 0 }
        vote_count: { type: integer, minimum: 0 }
        genres: { type: array, items: { $ref: "#/components/schemas/CatalogNamedValue" } }
        countries: { type: array, items: { $ref: "#/components/schemas/CatalogNamedValue" } }
        studios: { type: array, items: { $ref: "#/components/schemas/CatalogNamedValue" } }
        credits: { type: array, items: { $ref: "#/components/schemas/CatalogCredit" } }
        external_ids: { type: object, additionalProperties: { type: string } }
        match_status: { type: string, enum: [matched, needs_review] }
        metadata_status: { type: string, enum: [pending, refreshing, ready, needs_review, failed] }
        metadata_revision: { type: integer, minimum: 1 }
        metadata_error_code: { type: string }
        provider: { type: string }
        provider_item_id: { type: string }
        identity_locked: { type: boolean }
        media_count: { type: integer, minimum: 1 }
        episode_count: { type: integer, minimum: 0 }
        completed_count: { type: integer, minimum: 0 }
        playable_media_id: { type: string }
        thumbnail_url: { type: string }
        poster_url:
          type: string
          description: 优先使用作品目录 poster/folder/cover 图片，否则回退到代表视频帧。
        backdrop_url: { type: string }
        duration_ms: { type: [integer, "null"], format: int64, minimum: 0 }
        resolution: { type: string, description: 当前可播放视频的宽高，尚未探测时为空字符串。 }
        progress_ms: { type: integer, format: int64, minimum: 0 }
        completed: { type: boolean }
        favorite: { type: boolean, description: 当前用户的作品级收藏状态。 }
        favorite_revision: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }
        episodes: { type: array, items: { $ref: "#/components/schemas/CatalogEpisode" } }
        versions: { type: array, items: { $ref: "#/components/schemas/CatalogVersion" }, description: 仅电影详情返回的本地文件版本。 }
    CatalogNamedValue:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
    CatalogCredit:
      type: object
      required: [name, order]
      properties:
        provider_person_id: { type: string }
        name: { type: string }
        character: { type: string }
        department: { type: string }
        job: { type: string }
        order: { type: integer, minimum: 0 }
        profile_url: { type: string, description: 受鉴权的演职员头像地址；缺失时为空。 }
    CatalogVersion:
      type: object
      required: [media_id, label, file_size, duration_ms, resolution, video_codec, audio_codec, audio_track_count, progress_ms, completed, selected]
      properties:
        media_id: { type: string }
        label: { type: string, description: 服务端根据已探测规格生成的版本标签。 }
        file_size: { type: integer, format: int64, minimum: 0 }
        duration_ms: { type: [integer, "null"], format: int64, minimum: 0 }
        resolution: { type: string }
        video_codec: { type: string }
        audio_codec: { type: string }
        audio_track_count: { type: integer, minimum: 0 }
        progress_ms: { type: integer, format: int64, minimum: 0 }
        completed: { type: boolean }
        selected: { type: boolean }
    CatalogUserData:
      type: object
      required: [catalog_item_id, favorite, revision, updated_at]
      properties:
        catalog_item_id: { type: string }
        favorite: { type: boolean }
        revision: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
    UpdateCatalogUserData:
      type: object
      additionalProperties: false
      required: [favorite, base_revision]
      properties:
        favorite: { type: boolean }
        base_revision: { type: integer, format: int64, minimum: 0 }
    MetadataCandidate:
      type: object
      required: [id, provider, provider_item_id, title, original_title, year, overview, score, reasons]
      properties:
        id: { type: string }
        provider: { type: string }
        provider_item_id: { type: string }
        title: { type: string }
        original_title: { type: string }
        year: { type: [integer, "null"] }
        overview: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        reasons: { type: array, items: { type: string } }
    MetadataQueueResult:
      type: object
      required: [queued_count]
      properties:
        queued_count: { type: integer, minimum: 0 }
    SelectMetadataIdentity:
      type: object
      additionalProperties: false
      required: [provider, provider_item_id, base_revision]
      properties:
        provider: { type: string, minLength: 1, maxLength: 32 }
        provider_item_id: { type: string, minLength: 1, maxLength: 256 }
        base_revision: { type: integer, minimum: 1 }
    MetadataProviderStatus:
      type: object
      required: [id, name, enabled, capabilities, available, message]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        available: { type: boolean }
        message: { type: string }
    CatalogIssue:
      type: object
      required: [media_id, filename, source_id, library_kind, suggested_title, season_number, episode_number]
      properties:
        media_id: { type: string }
        filename: { type: string }
        source_id: { type: string }
        library_kind: { type: string, enum: [movies, tv] }
        suggested_title: { type: string }
        season_number: { type: [integer, "null"], minimum: 0 }
        episode_number: { type: [integer, "null"], minimum: 1 }
    UpdateCatalogMatch:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [movie, series] }
        title: { type: string, minLength: 1, maxLength: 200 }
        year: { type: [integer, "null"], minimum: 1800, maximum: 3000 }
        season_number: { type: [integer, "null"], minimum: 0 }
        episode_number: { type: [integer, "null"], minimum: 1 }
        ignored: { type: boolean }
    Tag:
      type: object
      additionalProperties: false
      required: [id, name, usage_count, revision, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        usage_count: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaUserData:
      type: object
      additionalProperties: false
      required: [media_id, custom_title, favorite, notes, progress_ms, completed, last_played_at, tags, revision, created_at, updated_at]
      properties:
        media_id: { type: string }
        custom_title: { type: [string, "null"], maxLength: 200 }
        favorite: { type: boolean }
        notes: { type: [string, "null"], maxLength: 20000, description: 另有 64 KiB UTF-8 字节上限；只有 null 表示清除，空字符串会原样保存。 }
        progress_ms: { type: integer, format: int64, minimum: 0 }
        completed: { type: boolean }
        last_played_at: { type: [string, "null"], format: date-time }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        revision: { type: integer, format: int64, minimum: 0 }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    UpdateMediaUserData:
      type: object
      additionalProperties: false
      required: [base_revision]
      minProperties: 2
      properties:
        base_revision: { type: integer, format: int64, minimum: 0 }
        custom_title: { type: [string, "null"], minLength: 1, maxLength: 200 }
        favorite: { type: boolean }
        notes: { type: [string, "null"], maxLength: 20000, description: 另有 64 KiB UTF-8 字节上限；只有 null 表示清除，空字符串会原样保存。 }
        tag_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string } }
    UpdateProgress:
      type: object
      additionalProperties: false
      required: [position_ms, base_revision]
      properties:
        position_ms: { type: integer, format: int64, minimum: 0 }
        base_revision: { type: integer, format: int64, minimum: 0 }
    CreateTag:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    UpdateTag:
      type: object
      additionalProperties: false
      required: [name, base_revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        base_revision: { type: integer, format: int64, minimum: 1 }
  parameters:
    SourceID:
      in: path
      name: id
      required: true
      schema: { type: string }
    MediaID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Unauthorized:
      description: API Token 缺失或无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 请求参数、请求体或业务输入无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenPath:
      description: 媒体源路径不在白名单中
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 当前身份没有执行该管理操作的权限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaNotFound:
      description: 媒体不存在或当前不可见，error.code 为 MEDIA_NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: MEDIA_NOT_FOUND, message: 媒体不存在, details: null }
    MediaOrThumbnailNotFound:
      description: 媒体不存在时 error.code 为 MEDIA_NOT_FOUND；媒体没有可用缩略图资产时为 THUMBNAIL_NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            media_not_found:
              value:
                error: { code: MEDIA_NOT_FOUND, message: 媒体不存在, details: null }
            thumbnail_not_found:
              value:
                error: { code: THUMBNAIL_NOT_FOUND, message: 缩略图不存在, details: null }
    Conflict:
      description: 资源状态或唯一性冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
